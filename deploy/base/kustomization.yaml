apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: binarybitops-demo

labels:
  - pairs:
      app.kubernetes.io/part-of: hde-phase3
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - pdb.yaml

images:
  - name: binarybitops-demo
    newName: 445137568300.dkr.ecr.eu-north-1.amazonaws.com/binarybitops-demo
    newTag: 0.1.0
