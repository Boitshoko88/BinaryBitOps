apiVersion: apps/v1
kind: Deployment
metadata:
  name: binarybitops-demo
spec:
  template:
    spec:
      # Created by the platform team from the approved registry credential
      # (Vault-managed, never committed). Remove only if the registry is public
      # or the node role already grants pull access.
      imagePullSecrets:
        - name: ecr-pull-auth
