# Alternative to the Agent Injector: External Secrets Operator.
#
# Use this only where ESO is the approved integration. The resulting Kubernetes
# Secret is mounted at /vault/secrets/demo.json, so the workload code is
# unchanged. The secret value exists only in Vault and in-cluster, never in Git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: binarybitops-demo
  namespace: binarybitops-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: hde-vault
    kind: ClusterSecretStore
  target:
    name: binarybitops-demo-secret
    creationPolicy: Owner
    template:
      data:
        demo.json: |
          {"demo-api-key":"{{ .demo_api_key }}","rotation_epoch":"{{ .rotation_epoch }}"}
  data:
    - secretKey: demo_api_key
      remoteRef:
        key: secret/data/hde/nonprod/binarybitops-demo
        property: demo_api_key
    - secretKey: rotation_epoch
      remoteRef:
        key: secret/data/hde/nonprod/binarybitops-demo
        property: rotation_epoch
---
# Mount the ESO-managed Secret as a read-only file at the path the workload
# already reads. Apply as an overlay patch; kept separate from the base so the
# default deployment does not require ESO.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: binarybitops-demo
spec:
  template:
    spec:
      volumes:
        - name: vault-secret
          secret:
            secretName: binarybitops-demo-secret
            defaultMode: 0400
      containers:
        - name: app
          volumeMounts:
            - name: vault-secret
              mountPath: /vault/secrets
              readOnly: true
